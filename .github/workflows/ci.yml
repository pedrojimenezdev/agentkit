name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The full suite, compiled to JS first. This is the one that runs on every
      # supported Node — `node --test` cannot strip TypeScript before 22.6.
      - name: Test (compiled)
        run: npm run test:compiled

      # The fast path contributors use locally. Native type stripping needs
      # Node 22.6+, so it is skipped on 20 rather than failing there.
      - name: Test (native TypeScript)
        if: matrix.node != '20'
        run: npm test

      - name: Build
        run: npm run build
